# Merge this service into the stack on the server.
#
# Prefer pulling a prebuilt image: this build needs several GB of RAM and a
# small instance will OOM. Build it in CI, push it, and drop the `build:` block.
#
# TLS is expected to terminate at whatever proxy already fronts the stack, so
# this listens on plain HTTP and reads the client address from X-Forwarded-For.

services:
  coracle:
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: coracle:latest
    restart: unless-stopped
    ports:
      - "8080:80"
